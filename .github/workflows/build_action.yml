name: GitHub CI

on: [push]

jobs:
  Build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install meson ninja
      - name: Prepare build
        run: meson setup build
      - name: Run build
        run: meson compile -C build
